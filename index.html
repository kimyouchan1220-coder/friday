<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프라이데이</title>
<style>

</style></head><body>
<header><b>FRIDAY</b><span><button id="wk">👂</button> <button id="sp"></button> <button id="cfg">설정</button></span></header>
<div id="log"></div>
<footer><button id="mic">🎤</button><input id="t" placeholder="프라이데이에게 말하기"><button id="go">전송</button></footer>
<dialog id="d"><h3>설정</h3>
<label>Gemini API 키 (이 기기 브라우저에만 저장)</label><input id="k" type="password">
<label>모델 <button id="ml" type="button">목록 조회</button></label><select id="m"></select>
<label>음성 (여성 음성 선택)</label><select id="v"></select>
<label>Alpha Vantage 키 (주가 조회용, 이 기기 브라우저에만 저장)</label><input id="av" type="password">
<label>말하기 속도</label><input id="r" type="range" min=".7" max="1.5" step=".1" value="1.05">
<p style="text-align:right"><button id="x" type="button">기록 삭제</button> <button id="ok">저장</button></p></dialog>
<script>
const $=i=>document.getElementById(i),L=localStorage,API="https://generativelanguage.googleapis.com/v1beta/models";
const SYS="너의 이름은 프라이데이, 사용자의 개인용 AI 비서다. 한국어로 답한다. 냉정하고 명확하게, 군더더기와 아부 없이 말한다. 음성으로 읽히므로 마크다운 기호를 쓰지 말고 기본 3문장 이내로 답한다. 모르는 것은 모른다고 하고, 출처 없는 수치는 단정하지 않는다. 투자는 확정적 조언 대신 근거와 불확실성을 함께 제시한다.";
let H=JSON.parse(L.f_h||"[]"),speak=L.f_s!=="0",busy=false,V=[],rec;
const save=()=>{H=H.slice(-30);while(H.length&&H[0].role!=="user")H.shift();L.f_h=JSON.stringify(H)};
function add(c,t){const e=document.createElement("div");e.className="m "+c;e.textContent=t;$("log").append(e);$("log").scrollTop=1e9;return e}
function loadV(){V=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
 const p=V.find(v=>/heami|sunhi|yuna|google.*(한국|korea)/i.test(v.name))||V[0];
 $("v").innerHTML=V.map(v=>`<option>${v.name}</option>`).join("");$("v").value=L.f_v||(p?p.name:"")}
speechSynthesis.onvoiceschanged=loadV;loadV();
function say(t){return new Promise(res=>{if(!speak||!t)return res();speechSynthesis.cancel();pauseL();const u=new SpeechSynthesisUtterance(t.replace(/[*#`_>~]/g,""));
 u.lang="ko-KR";const v=V.find(x=>x.name===(L.f_v||$("v").value));if(v)u.voice=v;u.rate=+(L.f_r||1.05);
 u.onend=u.onerror=()=>{res();if(wake)setTimeout(listen,400)};speechSynthesis.speak(u)})}
const LJ=k=>{try{return JSON.parse(L[k]||"[]")}catch(_){return[]}},LS=(k,v)=>{try{L[k]=JSON.stringify(v)}catch(_){}};
const AL={"엔비디아":"NVDA","코카콜라":"KO","아이온큐":"IONQ","로켓랩":"RKLB","테슬라":"TSLA","애플":"AAPL","마이크로소프트":"MSFT","구글":"GOOGL","알파벳":"GOOGL","아마존":"AMZN","메타":"META","인텔":"INTC","에이엠디":"AMD","팔란티어":"PLTR","브이오오":"VOO","슈드":"SCHD","제이이피아이":"JEPI"};
const nm=y=>Object.keys(AL).find(k=>AL[k]===y)||y;
function symOf(t){for(const k in AL)if(t.includes(k))return AL[k];const m=t.match(/\b[A-Z]{1,5}\b/);return m?m[0]:null}
async function quote(list){const key=L.f_av;if(!key)return"설정에서 Alpha Vantage 키를 먼저 입력하세요.";const out=[];
 for(const y of list){try{const r=await fetch("https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol="+encodeURIComponent(y)+"&apikey="+encodeURIComponent(key));const j=await r.json(),g=j["Global Quote"];
  if(!g||!g["05. price"]){out.push(j.Note||j.Information?"호출 한도에 도달했거나 키에 문제가 있습니다.":nm(y)+" 시세를 찾지 못했습니다. 티커를 확인하세요.");if(j.Note||j.Information)break;continue}
  const c=+g["09. change"],pc=g["10. change percent"].replace("%","");
  out.push(nm(y)+" "+(+g["05. price"]).toFixed(2)+"달러, 전일 대비 "+Math.abs(c).toFixed(2)+"달러 "+(c>=0?"상승":"하락")+", "+Math.abs(+pc).toFixed(2)+"퍼센트. 기준 거래일 "+g["07. latest trading day"]+".")}
 catch(e){return"시세 서버에 연결하지 못했습니다. 브라우저 차단이나 네트워크 문제일 수 있습니다."}}
 return out.join(" ")+" 참고용 시세이며 지연될 수 있습니다."}
let timers=[],pend=null;
const fmt=n=>{const h=Math.floor(n/3600),m=Math.floor(n%3600/60),x=n%60;return[h?h+"시간":"",m?m+"분":"",x?x+"초":""].filter(Boolean).join(" ")||"0초"};
const nowStr=()=>new Date().toLocaleString("ko-KR",{dateStyle:"full",timeStyle:"short"});
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},600)}catch(_){}}
const HELP="할 수 있는 일: 1) 일반 질문과 대화 2) 현재 시각과 날짜 3) 타이머 (예: 10분 타이머, 1시간 30분 뒤에 알려줘) 4) 메모 (예: 메모 우유 사기, 메모 목록, 메모 전체 삭제) 5) 할 일 (예: 할 일 추가 운동, 할 일 목록, 할 일 1번 완료) 6) 미국 주가 조회 (예: 엔비디아 주가, NVDA 시세, 관심종목 추가 엔비디아, 관심종목 시세). 메모와 할 일은 이 기기의 브라우저에만 저장됩니다. 타이머는 이 탭이 열려 있을 때만 울립니다.";
const LIST=(a,e)=>a.length?a.map((x,i)=>(i+1)+"번 "+x).join(". "):e;
function local(t){t=t.trim().replace(/[.!?]+$/,"");
 if(pend){const k=pend;pend=null;if(/^(확인|응|네|예|그래|삭제)/.test(t)){if(k==="n")LS("f_notes",[]);else LS("f_todos",[]);return k==="n"?"메모를 모두 삭제했습니다.":"할 일을 모두 삭제했습니다."}return"취소했습니다."}
 if(/도움말|(뭘|뭐|무엇).*(할\s*수|도와)|할\s*수\s*있는\s*(일|기능|거)|기능\s*(알려|설명)/.test(t))return HELP;
 if(/타이머.*(취소|끄|꺼|중지|멈춰)/.test(t)){const n=timers.length;timers.forEach(x=>clearTimeout(x.id));timers=[];return n?"타이머를 모두 취소했습니다.":"실행 중인 타이머가 없습니다."}
 if(/타이머.*(남았|확인|몇|뭐)/.test(t)){const now=Date.now();timers=timers.filter(x=>x.end>now);return timers.length?timers.map(x=>x.label+" 타이머 "+fmt(Math.ceil((x.end-now)/1000))+" 남았습니다.").join(" "):"실행 중인 타이머가 없습니다."}
 const tm=[...t.matchAll(/(\d+)\s*(시간|분|초)/g)];
 if(tm.length&&/타이머|알려|알림|뒤에|후에/.test(t)&&!/메모|할\s*일/.test(t)){let sec=0;tm.forEach(m=>sec+=+m[1]*({"시간":3600,"분":60,"초":1}[m[2]]));
  if(sec<1||sec>86400)return"타이머는 1초 이상 24시간 이하로 설정할 수 있습니다.";
  const label=fmt(sec),id=setTimeout(()=>{timers=timers.filter(x=>x.id!==id);beep();const m=label+" 타이머가 끝났습니다.";add("f",m);say(m)},sec*1000);
  timers.push({id,end:Date.now()+sec*1000,label});return label+" 타이머를 시작합니다. 이 탭을 열어 두세요."}
 if(/관심\s*종목/.test(t)&&!/^(메모|할\s*일)/.test(t)){let w=LJ("f_wl"),m2;
  if(m2=t.match(/관심\s*종목\s*(추가|등록)\s*(.+)$/)){const y=symOf(m2[2]);if(!y)return"종목을 알아듣지 못했습니다. 영문 티커로 말씀해 주세요.";if(!w.includes(y)){w.push(y);LS("f_wl",w)}return nm(y)+" 관심종목에 추가했습니다. 현재 "+w.length+"개입니다."}
  if(m2=t.match(/관심\s*종목\s*(삭제|제거)\s*(.+)$/)){const y=symOf(m2[2]);w=w.filter(x=>x!==y);LS("f_wl",w);return y?nm(y)+" 삭제했습니다.":"종목을 알아듣지 못했습니다."}
  if(/(시세|주가)/.test(t)){if(!w.length)return"관심종목이 없습니다. 관심종목 추가 엔비디아처럼 말씀해 주세요.";return quote(w.slice(0,8))}
  return w.length?"관심종목: "+w.map(nm).join(", "):"관심종목이 없습니다."}
 if(/(주가|시세)/.test(t)&&!/^(메모|할\s*일)/.test(t)){const y=symOf(t);return y?quote([y]):"종목을 알아듣지 못했습니다. 등록된 이름이나 영문 티커로 말씀해 주세요."}
 if(/몇\s*시(?!간)|지금\s*시간|현재\s*시간|시간\s*알려/.test(t)){const d=new Date(),h=d.getHours(),mi=d.getMinutes();return"지금은 "+(h<12?"오전 ":"오후 ")+(h%12||12)+"시 "+(mi?mi+"분":"정각")+"입니다."}
 if(/(오늘|지금).*(날짜|며칠|몇\s*일|요일)|무슨\s*요일|며칠이야/.test(t))return"오늘은 "+new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})+"입니다.";
 if(/^메모\s*(목록|리스트|읽어|보여|확인)/.test(t)){return LIST(LJ("f_notes"),"저장된 메모가 없습니다.")}
 if(/^메모\s*(전체\s*)?(삭제|지워|비워)/.test(t)){if(!LJ("f_notes").length)return"저장된 메모가 없습니다.";pend="n";return"메모를 모두 삭제할까요? 확인이라고 말씀하세요."}
 let m=t.match(/^(.+?)\s*(?:라고|이라고)?\s*메모\s*(?:해\s*줘|해줘|해|저장해?줘?)$/)||t.match(/^메모(?:\s*(?:해\s*줘|해줘|해|저장해줘|저장|추가))?\s*[:,]?\s*(.+)$/);
 if(m){const c=(m[1]||"").trim();if(!c||/^(줘|해\s*줘|해줘|해|저장|추가)$/.test(c))return"무엇을 메모할까요?";const a=LJ("f_notes");a.push(c);LS("f_notes",a);return"메모했습니다. "+a.length+"번 메모입니다."}
 if(/^할\s*일\s*(목록|리스트|뭐|알려|읽어|보여|확인)/.test(t))return LIST(LJ("f_todos"),"할 일이 없습니다.");
 if(/^할\s*일\s*(전체\s*)?(삭제|지워|비워)/.test(t)){if(!LJ("f_todos").length)return"할 일이 없습니다.";pend="t";return"할 일을 모두 삭제할까요? 확인이라고 말씀하세요."}
 m=t.match(/^할\s*일\s*(\d+)\s*번?\s*(완료|끝|삭제)/);
 if(m){const a=LJ("f_todos"),i=+m[1]-1;if(i<0||i>=a.length)return"그 번호의 할 일이 없습니다.";const d=a.splice(i,1)[0];LS("f_todos",a);return d+" 완료 처리했습니다. 남은 할 일은 "+a.length+"개입니다."}
 m=t.match(/^할\s*일\s*(?:추가|등록)\s*[:,]?\s*(.+)$/);
 if(m){const a=LJ("f_todos");a.push(m[1].trim());LS("f_todos",a);return"할 일에 추가했습니다. 현재 "+a.length+"개입니다."}
 return null}
async function ask(q){q=q.trim();if(busy||!q)return;const lr=await local(q);if(lr!==null){add('u',q);add('f',lr);await say(lr);return}const key=L.f_k;
 if(!key){add("e","설정에서 API 키를 먼저 입력하세요.");$("cfg").click();return}
 busy=true;add("u",q);H.push({role:"user",parts:[{text:q}]});const w=add("f","…");
 try{const base=L.f_m||"gemini-3.8-flash",chain=[base,...["gemini-3.7-flash","gemini-3.5-flash-lite","gemini-3.1-flash-lite"].filter(x=>x!==base)];
   const body=JSON.stringify({systemInstruction:{parts:[{text:SYS+" 현재 시각: "+nowStr()+". 할 일·메모·타이머는 앱이 직접 처리하므로 대신 처리하는 척하지 않는다."}]},contents:H});let r,j;
   for(let i=0;i<chain.length;i++){const more=i<chain.length-1;
    try{r=await fetch(`${API}/${chain[i]}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body});j=await r.json()}
    catch(e){if(more){w.textContent="연결 재시도 중…";await new Promise(z=>setTimeout(z,1000));continue}throw new Error("네트워크 오류입니다. 연결을 확인하세요.")}
    if(r.ok)break;
    if(more&&([429,500,503,504].includes(r.status)||(r.status===404&&i>0))){w.textContent="서버가 혼잡해 다른 모델로 다시 시도합니다…";await new Promise(z=>setTimeout(z,1200));continue}
    break}
   if(!r.ok)throw new Error(r.status===503?"구글 서버가 혼잡합니다. 잠시 후 다시 시도하세요.":r.status===429?"무료 한도 초과입니다. 잠시 후 다시 시도하세요.":r.status===404?"모델명을 찾을 수 없습니다. 설정에서 모델 목록을 조회하세요.":(j&&j.error&&j.error.message)||r.status);
   const c=j.candidates&&j.candidates[0],t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||"").join(""):"";
  if(!t)throw new Error("응답이 비었습니다"+(j.promptFeedback&&j.promptFeedback.blockReason?" (차단: "+j.promptFeedback.blockReason+")":""));
  H.push({role:"model",parts:[{text:t}]});w.textContent=t;await say(t)
 }catch(e){H.pop();w.remove();add("e","오류: "+e.message)}
 busy=false;save()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{if(!SR)return add("e","이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용하세요.");
 if(rec){rec.stop();return}
 speechSynthesis.cancel();rec=new SR();rec.lang="ko-KR";rec.interimResults=false;
 rec.onstart=()=>$("mic").classList.add("on");
 rec.onresult=e=>ask(e.results[0][0].transcript);
 rec.onerror=e=>add("e","음성 인식 오류: "+e.error);
 rec.onend=()=>{rec=null;$("mic").classList.remove("on")};rec.start()};
$("go").onclick=()=>{const q=$("t").value;$("t").value="";ask(q)};
$("t").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
const icon=()=>$("sp").textContent=speak?"🔊":"🔇";icon();
$("sp").onclick=()=>{speak=!speak;L.f_s=speak?"1":"0";icon();if(!speak)speechSynthesis.cancel()};
$("cfg").onclick=()=>{$("k").value=L.f_k||"";$("r").value=L.f_r||"1.05";$("av").value=L.f_av||"";$("m").innerHTML=`<option>${L.f_m||"gemini-3.8-flash"}</option>`;loadV();$("d").showModal()};
$("ml").onclick=async()=>{const k=$("k").value.trim()||L.f_k;if(!k)return alert("키를 먼저 입력하세요.");
 try{const j=await(await fetch(`${API}?pageSize=200`,{headers:{"x-goog-api-key":k}})).json();
  const a=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/flash/.test(m.name)&&!/tts|image|live|audio|robot|computer/.test(m.name)).map(m=>m.name.replace("models/",""));
  if(!a.length)return alert("사용 가능한 모델이 없습니다. 키를 확인하세요.");
  $("m").innerHTML=a.map(n=>`<option>${n}</option>`).join("");$("m").value=a.includes(L.f_m)?L.f_m:a[0]
 }catch(e){alert("조회 실패: "+e.message)}};
$("ok").onclick=()=>{L.f_k=$("k").value.trim();L.f_m=$("m").value;L.f_v=$("v").value;L.f_av=$("av").value.trim();L.f_r=$("r").value;$("d").close()};
$("x").onclick=()=>{H=[];save();$("log").innerHTML=""};
let wake=false,act=false,ar,tm,lock,fails=0,rd=300;
const WR=/프라이\s?데이|프라이\s?대이|friday/i,arm=()=>{clearTimeout(tm);tm=setTimeout(()=>{act=false},20000)};
const ui=()=>{$("wk").style.background=wake?"#0a7":"";$("wk").textContent=wake?"👂 대기중":"👂"};
function pauseL(){if(ar){ar.onend=null;ar.abort();ar=null}}
function listen(){if(!wake||ar||speechSynthesis.speaking)return;
 ar=new SR();ar.lang="ko-KR";ar.continuous=true;ar.interimResults=false;
