<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04080f"><title>프라이데이</title>

<style>

#stage::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(66vw,340px);height:20px;background:radial-gradient(closest-side,rgba(95,243,255,.30),transparent);filter:blur(5px);pointer-events:none}

.r,.core,.rip{transform-box:fill-box;transform-origin:center}
.r{animation:spin 64s linear infinite}.r2{animation-duration:28s;animation-direction:reverse}.r3{animation-duration:40s}.r4{animation-duration:19s;animation-direction:reverse}.r5{animation-duration:96s}

body[data-st=think] .r2{animation-duration:2.8s}body[data-st=think] .r4{animation-duration:3.6s}body[data-st=think] .r3{animation-duration:9s}
body[data-st=speak] .core{animation:talk .9s ease-in-out infinite}body[data-st=speak] .rip{animation:rip 1.7s ease-out infinite}
body[data-st=off] #orb{opacity:.38;filter:saturate(.25)}body[data-st=off] .r{animation-duration:260s}body[data-st=off] .core{animation:none}

.u::before,.u::after{right:auto;left:-1px;border-right-width:0}.u::before{border-left-width:1px}.u::after{border-left-width:1px}

#mic{width:44px;display:grid;place-items:center;padding:0;color:var(--line)}#mic.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,196,107,.4)}

@media (prefers-reduced-motion:reduce){.r,.core,.rip,.m{animation:none!important}}

</style></head><body>

<script>
const $=i=>document.getElementById(i),L=localStorage,API="https://generativelanguage.googleapis.com/v1beta/models";
const SYS="너의 이름은 프라이데이, 사용자의 개인용 AI 비서다. 한국어로 답한다. 냉정하고 명확하게, 군더더기와 아부 없이 말한다. 음성으로 읽히므로 마크다운 기호를 쓰지 말고 기본 3문장 이내로 답한다. 모르는 것은 모른다고 하고, 출처 없는 수치는 단정하지 않는다. 검색 결과나 앱이 준 데이터가 있으면 그것을 근거로 답하고 기준일을 밝힌다. 투자는 확정적 조언 대신 근거와 불확실성을 함께 제시한다.";
let H=JSON.parse(L.f_h||"[]"),speak=L.f_s!=="0",busy=false,V=[],rec;
const save=()=>{H=H.slice(-30);while(H.length&&H[0].role!=="user")H.shift();L.f_h=JSON.stringify(H)};
function add(c,t){const e=document.createElement("div");e.className="m "+c+(c==="e"&&/^(오류|마이크가 차단)/.test(t)?" bad":"");e.textContent=t;$("log").append(e);$("log").scrollTop=1e9;return e}
function loadV(){V=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
 const p=V.find(v=>/heami|sunhi|yuna|google.*(한국|korea)/i.test(v.name))||V[0];
 $("v").innerHTML=V.map(v=>`<option>${v.name}</option>`).join("");$("v").value=L.f_v||(p?p.name:"")}
speechSynthesis.onvoiceschanged=loadV;loadV();
function say(t){return new Promise(res=>{if(!speak||!t)return res();speechSynthesis.cancel();pauseL();const u=new SpeechSynthesisUtterance(t.replace(/[*#`_>~]/g,""));
 u.lang="ko-KR";const v=V.find(x=>x.name===(L.f_v||$("v").value));if(v)u.voice=v;u.rate=+(L.f_r||1.05);
 u.onend=u.onerror=()=>{res();if(wake)setTimeout(listen,400)};speechSynthesis.speak(u)})}
const LJ=k=>{try{return JSON.parse(L[k]||"[]")}catch(_){return[]}},LS=(k,v)=>{try{L[k]=JSON.stringify(v)}catch(_){}};
const AL={"엔비디아":"NVDA","코카콜라":"KO","아이온큐":"IONQ","로켓랩":"RKLB","테슬라":"TSLA","애플":"AAPL","마이크로소프트":"MSFT","구글":"GOOGL","알파벳":"GOOGL","아마존":"AMZN","메타":"META","인텔":"INTC","에이엠디":"AMD","팔란티어":"PLTR","브이오오":"VOO","슈드":"SCHD","제이이피아이":"JEPI"};
const nm=y=>Object.keys(AL).find(k=>AL[k]===y)||y;
function symOf(t){for(const k in AL)if(t.includes(k))return AL[k];const m=t.match(/\b[A-Z]{1,5}\b/);return m?m[0]:null}
async function quote(list){const key=L.f_av;if(!key)return"설정에서 Alpha Vantage 키를 먼저 입력하세요.";const out=[];
 for(const y of list){try{const r=await fetch("https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol="+encodeURIComponent(y)+"&apikey="+encodeURIComponent(key));const j=await r.json(),g=j["Global Quote"];
  if(!g||!g["05. price"]){out.push(j.Note||j.Information?"호출 한도에 도달했거나 키에 문제가 있습니다.":nm(y)+" 시세를 찾지 못했습니다. 티커를 확인하세요.");if(j.Note||j.Information)break;continue}
  const c=+g["09. change"],pc=g["10. change percent"].replace("%","");
  out.push(nm(y)+" "+(+g["05. price"]).toFixed(2)+"달러, 전일 대비 "+Math.abs(c).toFixed(2)+"달러 "+(c>=0?"상승":"하락")+", "+Math.abs(+pc).toFixed(2)+"퍼센트. 기준 거래일 "+g["07. latest trading day"]+".")}
 catch(e){return"시세 서버에 연결하지 못했습니다. 브라우저 차단이나 네트워크 문제일 수 있습니다."}}
 return out.join(" ")+" 참고용 시세이며 지연될 수 있습니다."}
let timers=[],pend=null;
const fmt=n=>{const h=Math.floor(n/3600),m=Math.floor(n%3600/60),x=n%60;return[h?h+"시간":"",m?m+"분":"",x?x+"초":""].filter(Boolean).join(" ")||"0초"};
const nowStr=()=>new Date().toLocaleString("ko-KR",{dateStyle:"full",timeStyle:"short"});
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},600)}catch(_){}}
const HELP="할 수 있는 일: 1) 일반 질문과 대화 2) 시각·날짜 3) 타이머와 알림 (예: 10분 타이머, 오후 3시 30분에 알려줘) 4) 메모 5) 할 일 6) 미국 주가 (예: 엔비디아 주가, 관심종목 시세) 7) 종목 분석 (예: 엔비디아 분석해줘) 8) 날씨 (예: 부산 날씨, 내일 날씨, 도시 설정 부산) 9) 환율 (예: 환율, 100달러 얼마) 10) 계산 (예: 3500 곱하기 12 계산) 11) 상황 보고 (예: 브리핑) 12) 링크 열기 (유튜브 검색, 지도, 채용 검색) 13) 지원 관리 (예: 지원 추가 부산항만공사 마감 10월 20일, 지원 현황, 지원 1번 면접, 마감 임박) 14) 지출 기록 (예: 점심 8천원 썼어, 이번 달 지출, 지출 취소) 15) 보유 종목과 포트폴리오 점검 (예: 보유 추가 엔비디아 10주 평단 120달러, 보유 목록, 포트폴리오 점검) 16) 종목 데이터 분석 (예: 엔비디아 분석해줘) 17) 백업과 복원 (예: 백업, 복원). 메모·할 일·설정은 이 기기의 브라우저에만 저장됩니다. 타이머는 이 탭이 열려 있을 때만 울립니다.";
const LIST=(a,e)=>a.length?a.map((x,i)=>(i+1)+"번 "+x).join(". "):e;
const CITY={"서울":[37.5665,126.978],"부산":[35.1796,129.0756],"인천":[37.4563,126.7052],"대구":[35.8714,128.6014],"대전":[36.3504,127.3845],"광주":[35.1595,126.8526],"울산":[35.5384,129.3114],"세종":[36.48,127.289],"수원":[37.2636,127.0286],"창원":[35.228,128.6811],"제주":[33.4996,126.5312],"포항":[36.019,129.3435],"김해":[35.2285,128.8894],"성남":[37.42,127.1267],"고양":[37.6584,126.832],"용인":[37.2411,127.1776],"청주":[36.6424,127.489],"전주":[35.8242,127.148],"천안":[36.8151,127.1139],"여수":[34.7604,127.6622],"춘천":[37.8813,127.7298],"강릉":[37.7519,128.8761]};
const WX={0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"안개",51:"약한 이슬비",53:"이슬비",55:"강한 이슬비",56:"어는 이슬비",57:"어는 이슬비",61:"약한 비",63:"비",65:"강한 비",66:"어는 비",67:"어는 비",71:"약한 눈",73:"눈",75:"강한 눈",77:"싸락눈",80:"약한 소나기",81:"소나기",82:"강한 소나기",85:"눈 소나기",86:"강한 눈 소나기",95:"뇌우",96:"우박 동반 뇌우",99:"강한 우박 동반 뇌우"};
async function geo(n){if(CITY[n])return{lat:CITY[n][0],lon:CITY[n][1],name:n};
 const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(n)+"&count=5&language=ko"),j=await r.json(),a=(j.results||[]).sort((x,y)=>(y.population||0)-(x.population||0));
 return a[0]?{lat:a[0].latitude,lon:a[0].longitude,name:n}:null}
function gps(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(q=>ok({lat:q.coords.latitude,lon:q.coords.longitude,name:"현재 위치"}),no,{timeout:8000,maximumAge:3600000})})}
async function weather(city,day){
 try{let p;
  if(city){p=await geo(city);if(!p)return city+" 지역을 찾지 못했습니다."}
  else if(L.f_city){p=await geo(L.f_city);if(!p)return"기본 도시를 찾지 못했습니다. 도시 설정 부산처럼 다시 말씀해 주세요."}
  else{try{p=await gps()}catch(_){return"위치를 알 수 없습니다. 도시 설정 부산처럼 말씀해 주세요."}}
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon+"&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2"),j=await r.json();
  const d=j.daily,c=j.current;if(!d||!c)return"날씨 정보를 받지 못했습니다.";
  const rn=x=>Math.round(x),pr=d.precipitation_probability_max[day],cond=WX[d.weather_code[day]]||"정보 없음";
  const s=(day?p.name+" 내일 ":p.name+" 현재 "+rn(c.temperature_2m)+"도, 체감 "+rn(c.apparent_temperature)+"도, "+(WX[c.weather_code]||"")+". 오늘 ")+(day?cond+", ":"")+"최저 "+rn(d.temperature_2m_min[day])+"도, 최고 "+rn(d.temperature_2m_max[day])+"도"+(pr!=null?", 강수확률 "+pr+"퍼센트":"")+"."+(pr>=50?" 우산을 챙기세요.":"");
