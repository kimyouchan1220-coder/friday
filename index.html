<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>프라이데이</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Oxanium:wght@300;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--void:#01060d;--deep:#04101d;--glass:rgba(6,22,36,.62);--line:#72dcff;--a:#72dcff;--b:#2b7dff;--n:#ffb04a;--dim:rgba(114,220,255,.24);--gold:#ffb04a;--text:#e6f6ff;--mute:#7d9fb0;--alert:#ff8576;--disp:"Oxanium","Noto Sans KR",system-ui,sans-serif;--cut:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:row;color:var(--text);font:15px/1.5 "Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;background:radial-gradient(52% 46% at 50% 26%,rgba(47,140,255,.22),transparent 72%),radial-gradient(110% 64% at 50% 0%,#0a2c42 0%,transparent 64%),var(--void);overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%),linear-gradient(rgba(114,220,255,.035) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(114,220,255,.035) 1px,transparent 1px) 0 0/40px 40px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px);z-index:5}
header,#stage,#log,#hr,footer{position:relative;z-index:1}
header{padding:14px max(18px,calc((100% - 900px)/2)) 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header::after{content:"";position:absolute;left:max(18px,calc((100% - 900px)/2));right:max(18px,calc((100% - 900px)/2));bottom:0;height:1px;background:linear-gradient(90deg,var(--line),var(--dim) 30%,transparent)}

nav{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit;background:var(--glass);border:1px solid var(--dim);border-radius:0;padding:8px 10px}
button{cursor:pointer;transition:border-color .15s,color .15s,background .15s,box-shadow .15s}
button:hover{border-color:var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav button{font-size:12px;padding:5px 11px;color:var(--mute);background:rgba(8,28,44,.35);clip-path:var(--cut)}
nav button:hover{color:var(--text);background:rgba(114,220,255,.08)}
#wk::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-right:7px;vertical-align:1px}
#wk.on{color:var(--text)}#wk.on::before{background:var(--line);box-shadow:0 0 9px var(--line)}
.fr{position:absolute;inset:7px;pointer-events:none;z-index:3;opacity:.5;background:linear-gradient(var(--line),var(--line)) 0 0/20px 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 0/1px 20px no-repeat,linear-gradient(var(--line),var(--line)) 100% 0/20px 1px no-repeat,linear-gradient(var(--line),var(--line)) 100% 0/1px 20px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/20px 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/1px 20px no-repeat,linear-gradient(var(--line),var(--line)) 100% 100%/20px 1px no-repeat,linear-gradient(var(--line),var(--line)) 100% 100%/1px 20px no-repeat}
/* 홀로그램 무대 */
#stage{height:clamp(250px,43vh,410px);overflow:hidden;display:grid;justify-items:center;align-items:stretch;padding:0}
#stage::before{content:"";position:absolute;left:-12%;right:-12%;bottom:-8%;height:50%;background:linear-gradient(rgba(114,220,255,.24) 1px,transparent 1px) 0 0/46px 46px,linear-gradient(90deg,rgba(114,220,255,.24) 1px,transparent 1px) 0 0/46px 46px;transform:perspective(360px) rotateX(63deg);transform-origin:50% 100%;-webkit-mask-image:radial-gradient(closest-side,#000 10%,transparent 88%);mask-image:radial-gradient(closest-side,#000 10%,transparent 88%);pointer-events:none}
#hold{position:relative;height:100%;aspect-ratio:1/1;max-width:100%}
#beam{position:absolute;left:50%;bottom:9%;width:64%;height:74%;transform:translateX(-50%);background:linear-gradient(0deg,rgba(114,220,255,.30),rgba(114,220,255,.06) 55%,transparent);clip-path:polygon(34% 100%,66% 100%,100% 0,0 0);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);filter:blur(2px);pointer-events:none}
#orb{position:absolute;left:0;top:0;width:100%;height:87%;overflow:visible;filter:drop-shadow(0 0 7px rgba(114,220,255,.45));animation:float 7s ease-in-out infinite}
#base{position:absolute;left:3%;right:3%;bottom:0;height:19%;width:94%;overflow:visible}
#base *{fill:none;stroke:var(--a)}
#base .em{fill:url(#eg);stroke:none}
#base .bd{animation:dash 14s linear infinite}
#orb *{fill:none;stroke:var(--a)}
#orb .halo{fill:url(#hg);stroke:none}#orb .node{fill:var(--n);stroke:none}#orb .core{fill:url(#cg);stroke:none}#orb .pt{fill:#fff;stroke:none}#orb .bar{fill:var(--a);stroke:none}
#orb .grad{stroke:url(#lg)}
#orb .mer,#orb .lat{vector-effect:non-scaling-stroke}
#orb *{transform-box:fill-box;transform-origin:center}
.r{animation:spin 90s linear infinite}.r2{animation-duration:34s;animation-direction:reverse}.r3{animation-duration:52s}.r4{animation-duration:22s;animation-direction:reverse}.r5{animation-duration:70s}
.mer{animation:mer 18s ease-in-out infinite}
.globe{animation:none}
#orb .bar{transform-origin:50% 100%;animation:eq 2.6s ease-in-out infinite;transform:scaleY(.3)}
#orb .r,#orb .sweep,#orb g{transform-box:view-box;transform-origin:0 0}
.core{animation:breathe 3.8s ease-in-out infinite}
.rip{opacity:0}#orb .sweep{opacity:0;animation:spin 1.7s linear infinite}
.scan{position:absolute;left:10%;right:10%;top:6%;height:2px;background:linear-gradient(90deg,transparent,rgba(114,220,255,.8),transparent);opacity:0;animation:scan 7s ease-in-out infinite;pointer-events:none;filter:blur(.4px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mer{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.001)}50%{transform:scaleX(-1)}75%{transform:scaleX(.001)}}
@keyframes eq{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(.62)}}
@keyframes eqs{0%,100%{transform:scaleY(.3)}30%{transform:scaleY(1.9)}60%{transform:scaleY(.7)}80%{transform:scaleY(1.45)}}
@keyframes eqt{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(.9)}}
@keyframes breathe{50%{transform:scale(1.1);opacity:.85}}
@keyframes talk{0%,100%{transform:scale(.94)}35%{transform:scale(1.28)}65%{transform:scale(1.05)}}
@keyframes flick{0%,100%{opacity:1}40%{opacity:.72}55%{opacity:1}70%{opacity:.86}}
@keyframes rip{from{transform:scale(1);opacity:.5}to{transform:scale(3.1);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scan{0%,100%{top:8%;opacity:0}12%{opacity:.5}50%{top:76%;opacity:.35}88%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-120}}
body[data-st=listen] .rip{animation:rip 3.6s ease-out infinite}
body[data-st=think] .r{animation-duration:12s}body[data-st=think] .r2{animation-duration:3.4s}body[data-st=think] .r4{animation-duration:4.2s}body[data-st=think] .mer{animation-duration:5s}
body[data-st=think] #orb .sweep{opacity:.9}body[data-st=think] #orb .bar{animation:eqt .9s ease-in-out infinite}body[data-st=think] .core{animation:flick .5s steps(2) infinite}
body[data-st=speak] .core{animation:talk .8s ease-in-out infinite}body[data-st=speak] .rip{animation:rip 1.6s ease-out infinite}body[data-st=speak] #orb .bar{animation:eqs .7s ease-in-out infinite}body[data-st=speak] .mer{animation-duration:9s}
body[data-st=off] #orb,body[data-st=off] #base,body[data-st=off] #beam{opacity:.34;filter:saturate(.2)}body[data-st=off] .r,body[data-st=off] .mer{animation-duration:320s}body[data-st=off] #orb .core,body[data-st=off] #orb .bar{animation:none}body[data-st=off] .scan{display:none}
body[data-act="1"]{--a:#ffb04a;--b:#ff8a3d;--n:#72dcff}
body[data-act="1"] #beam{background:linear-gradient(0deg,rgba(255,176,74,.30),rgba(255,176,74,.06) 55%,transparent)}
#stt{display:none;position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:13px;color:var(--mute)}
.hud{position:absolute;top:44%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;font-family:var(--disp);z-index:2}
.hud b{font:500 28px/1 var(--disp);letter-spacing:.05em;color:var(--text);text-shadow:0 0 16px rgba(114,220,255,.55);font-variant-numeric:tabular-nums}
.hud span{font-size:12px;line-height:1.5;color:var(--mute);letter-spacing:.06em;white-space:pre;font-family:"Noto Sans KR",var(--disp)}
.hud::after{content:"";position:absolute;top:15px;width:clamp(30px,6vw,86px);height:1px}
#hudL{left:max(24px,calc((100% - 900px)/2 + 6px))}#hudL::after{left:calc(100% + 12px);background:linear-gradient(90deg,var(--line),transparent)}
#hudR{right:max(24px,calc((100% - 900px)/2 + 6px));text-align:right;align-items:flex-end}#hudR::after{right:calc(100% + 12px);background:linear-gradient(270deg,var(--line),transparent)}
#hSt{color:var(--line);font-size:24px}body[data-act="1"] #hSt{color:var(--gold);text-shadow:0 0 16px rgba(255,176,74,.55)}
/* 대화 패널 */
#log{flex:1;overflow:auto;padding:16px max(18px,calc((100% - 900px)/2)) 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(114,220,255,.3) transparent;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
.m{position:relative;max-width:min(88%,640px);padding:11px 17px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;--c:var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);clip-path:var(--cut);animation:arrive .32s ease-out}
.m::before{content:"";position:absolute;inset:0;padding:1px;background:linear-gradient(135deg,var(--c),transparent 55%,var(--c));opacity:.6;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.m::after{content:"";position:absolute;top:11px;bottom:11px;width:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
.f{align-self:flex-start;background:linear-gradient(135deg,rgba(114,220,255,.13),rgba(114,220,255,.025))}.f::after{left:0}
.u{align-self:flex-end;--c:var(--gold);color:#fff4e0;background:linear-gradient(225deg,rgba(255,176,74,.15),rgba(255,176,74,.03))}.u::after{right:0}
.e{align-self:center;max-width:92%;padding:2px 8px;font-size:13px;color:var(--mute);background:none;text-align:center;clip-path:none;-webkit-backdrop-filter:none;backdrop-filter:none}.e::before,.e::after{display:none}
.e.bad{color:var(--alert)}
.m a{color:var(--gold);text-decoration-color:rgba(255,176,74,.45);text-underline-offset:3px}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#hr{padding:2px 16px;font-size:12px;color:var(--mute);min-height:20px;text-align:center}
footer{display:flex;gap:8px;padding:10px max(16px,calc((100% - 900px)/2)) max(14px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(2,8,18,.96),rgba(2,8,18,.3))}
footer::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--dim) 20%,var(--dim) 80%,transparent)}
#t{flex:1;min-width:0;border:1px solid var(--dim);background:rgba(114,220,255,.045);padding:11px 15px;font-size:16px;clip-path:var(--cut)}
#t::placeholder{color:var(--mute)}#t:focus{outline:none;border-color:var(--line);box-shadow:inset 0 0 20px rgba(114,220,255,.14)}
#mic{width:46px;display:grid;place-items:center;padding:0;color:var(--line);border-radius:50%;background:rgba(114,220,255,.06)}#mic.on{border-color:var(--gold);color:var(--gold);animation:mp 1.4s ease-out infinite}
@keyframes mp{0%{box-shadow:0 0 0 0 rgba(255,176,74,.45)}100%{box-shadow:0 0 0 14px rgba(255,176,74,0)}}
#go{color:#02222c;font-weight:600;padding:8px 20px;border:0;clip-path:var(--cut);background:linear-gradient(135deg,#8ffbff,#38c6e6);box-shadow:0 0 18px rgba(114,220,255,.3)}#go:hover{background:linear-gradient(135deg,#c4fdff,#5fe0f5)}
dialog{max-height:92vh;overflow:auto;background:rgba(5,16,29,.97);color:inherit;border:1px solid var(--dim);border-radius:0;width:min(92vw,420px);box-shadow:0 0 50px rgba(114,220,255,.14)}
dialog::backdrop{background:rgba(2,5,10,.74);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px;font:600 15px var(--disp);letter-spacing:.2em;color:var(--line)}
dialog input[type=range]{accent-color:var(--line);padding:0}
dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}dialog input,dialog select{width:100%}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;position:relative;z-index:1}
#side{width:288px;flex:none;display:flex;flex-direction:column;height:100dvh;overflow-y:auto;border-right:1px solid var(--dim);background:linear-gradient(180deg,rgba(4,18,32,.9),rgba(2,8,18,.94));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:1px 0 26px rgba(114,220,255,.07);position:relative;z-index:6;transition:margin-left .22s ease,transform .22s ease}
body.sb-off #side{margin-left:-288px}
#scrim{display:none}
.sh{padding:16px 14px 8px}
#nc{width:100%;color:var(--line);border-color:var(--line);background:rgba(114,220,255,.07);padding:11px 14px;text-align:left;clip-path:var(--cut)}#nc:hover{background:rgba(114,220,255,.15);box-shadow:inset 0 0 18px rgba(114,220,255,.15)}
#sq{margin:0 14px 6px;width:calc(100% - 28px);background:transparent;border:0;border-bottom:1px solid var(--dim);padding:8px 2px;font-size:13px}
#sq:focus{outline:none;border-bottom-color:var(--line)}
#cvl{flex:1 1 140px;min-height:110px;overflow:auto;padding:4px 8px;scrollbar-width:thin;scrollbar-color:rgba(114,220,255,.3) transparent}
.ci{display:flex;align-items:center;gap:2px;border-left:2px solid transparent}
.ci.on{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(255,176,74,.13),transparent)}
.ct{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px 8px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.cx{display:flex;opacity:0}.ci:hover .cx,.ci:focus-within .cx{opacity:1}
@media (hover:none){.cx{opacity:.75}}
.cx button{border:0;background:none;padding:4px 5px;font-size:11px;color:var(--mute)}.cx button:hover{color:var(--line)}
.none{padding:8px 10px;font-size:12px;color:var(--mute)}
.sg{padding:10px 16px 4px;font-size:12px;color:var(--mute)}
#qa{display:flex;flex-direction:column;padding:0 8px 6px}
#qa button{border:0;background:none;text-align:left;padding:7px 8px;font-size:13px;color:var(--text)}#qa button:hover{background:rgba(114,220,255,.08)}
.sf{display:flex;gap:6px;padding:10px 14px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--dim)}.sf button{flex:1;font-size:12px;background:transparent;color:var(--mute);padding:7px 6px;clip-path:var(--cut)}
.hl{display:flex;align-items:center;gap:10px}
#sb{padding:6px 8px;display:grid;place-items:center;color:var(--mute);background:transparent}
.acts{align-self:flex-start;display:flex;gap:4px;margin-top:-6px}.acts button{border:0;background:none;padding:2px 6px;font-size:12px;color:var(--mute)}.acts button:hover{color:var(--line)}
@media (max-width:820px){#side{position:fixed;left:0;top:0;bottom:0;z-index:20;margin-left:0}body.sb-off #side{transform:translateX(-104%)}#scrim{display:block;position:fixed;inset:0;background:rgba(2,5,10,.62);z-index:19}body.sb-off #scrim{display:none}}
@media (max-width:720px){.hud{display:none}#stt{display:block}#stage{height:clamp(220px,34vh,320px)}#hold{height:calc(100% - 22px);margin-bottom:22px}}
@media (max-height:600px){#stage{height:190px}}

#azk,#azr{margin-bottom:6px}
/* ===== v2: 정밀 HUD ===== */
:root{--cut:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));--mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace}
body{background:radial-gradient(40% 34% at 50% 24%,rgba(61,133,232,.2),transparent 70%),radial-gradient(90% 50% at 50% -6%,#0b2a3f 0%,transparent 66%),radial-gradient(120% 80% at 50% 120%,rgba(61,133,232,.08),transparent 60%),var(--void)}

@keyframes eqb{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(.55)}}

 if(!/(열어|띄워|켜\s*줘|켜|실행|보여\s*줘)/.test(t))return null;
 for(const k in WINAPP)if(WINAPP[k].k.test(t))return winOpen(k);
 return null}
function gsBtn(){const b=$("gs");if(b){b.classList.toggle("on",!!GS);b.textContent=GSL?"준비 중":"손동작";b.setAttribute("aria-pressed",GS?"true":"false")}}
async function gsOn(){
 if(GS)return"손동작 인식은 이미 켜져 있습니다.";if(GSL)return"손동작 인식을 준비하고 있습니다.";
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return"이 브라우저는 카메라를 지원하지 않습니다.";
 GSL=true;gsBtn();let st=null;
 try{
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false})}
  catch(e){let n=e&&e.name;
   if(n==="NotReadableError"||n==="OverconstrainedError"||n==="AbortError"){try{await new Promise(r=>setTimeout(r,600));st=await navigator.mediaDevices.getUserMedia({video:true,audio:false});n=""}catch(e2){n=(e2&&e2.name)||n;e=e2}}
   if(!st)return n==="NotAllowedError"?"카메라 권한이 거부되었습니다. 주소창 왼쪽 아이콘에서 카메라를 허용한 뒤 다시 말씀하세요.":n==="NotFoundError"?"카메라를 찾지 못했습니다.":n==="NotReadableError"?"카메라가 다른 프로그램에서 사용 중이라 켜지 못했습니다. 손짓 제어 프로그램(friday_gesture), 화상회의, Windows 카메라 앱, 다른 브라우저 탭을 닫고 다시 시도하세요. 계속 안 되면 Windows 설정 > 개인 정보 > 카메라에서 데스크톱 앱 카메라 접근이 켜져 있는지 확인하세요.":"카메라를 켜지 못했습니다: "+((e&&e.message)||n)}
  let lm=null,dg="CPU";
  try{GSLIB=GSLIB||await import(MPB+"/vision_bundle.js");const fs=GSFS=GSFS||await GSLIB.FilesetResolver.forVisionTasks(MPB+"/wasm");
   for(const d of["GPU","CPU"]){try{lm=await gsMake(fs,d);dg=d;break}catch(e){if(d==="CPU")throw e}}}
  catch(e){st.getTracks().forEach(k=>k.stop());return"손 인식 모델을 불러오지 못했습니다. 네트워크를 확인하세요. ("+((e&&e.message)||e)+")"}
  const box=document.createElement("div");box.id="gsv";box.setAttribute("aria-label","손동작 카메라 미리보기");
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");const cv=document.createElement("canvas");box.append(v,cv);$("stage").append(box);
  v.srcObject=st;try{await v.play()}catch(_){}
  GS={st,lm,v,cv,box,dg,det:swipeDet(),vt:-1,lt:0,raf:0,ms:0,n:0};gsLoop();camPose();
  return"손동작 인식을 켰습니다. "+GSHELP+" "+CAMHELP+" 영상은 이 기기 안에서만 처리하고 어디에도 보내지 않습니다."}
 finally{GSL=false;if(!GS&&st&&st.active)st.getTracks().forEach(k=>k.stop());gsBtn()}}
function gsOff(){if(!GS)return"손동작 인식은 꺼져 있습니다.";const g=GS;GS=null;HAND=null;cancelAnimationFrame(g.raf);try{g.st.getTracks().forEach(k=>k.stop())}catch(_){}try{g.lm.close()}catch(_){}try{g.ps&&g.ps.close()}catch(_){}if(g.pr&&g.pr.away&&g.pr.wk&&!wake){wake=true;paused=false;act=false;getLock();listen();ui()}g.box.remove();gsBtn();return"손동작 인식을 껐습니다. 카메라도 꺼졌습니다."}
function gsCmd(t){if(/(뭐야|뭔데|뭐지|뜻|설명\s*해|어떻게\s*만들|가능해|가능한가)/.test(t))return null;
 if(/^(손\s*동작|손\s*제스처|제스처|모션\s*(캡처|인식)?|손짓|카메라)\s*(인식\s*)?자동/.test(t)){if(/(꺼|끄|끔|해제|그만|off)/i.test(t)){L.f_gsauto="0";return"다음부터 손동작을 자동으로 켜지 않습니다. 지금 켜진 카메라는 ‘손동작 꺼줘’로 끌 수 있습니다."}
  if(/(켜|시작|활성|on)/i.test(t)){L.f_gsauto="1";if(!GS)return gsOn().then(m=>"Friday를 열면 손동작을 자동으로 켭니다. "+m);return"Friday를 열면 손동작을 자동으로 켭니다."}
  return"손동작 자동 시작은 "+(gsAutoOn()?"켜져":"꺼져")+" 있습니다."}if(!/^(손\s*동작|손\s*제스처|제스처|모션\s*(캡처|인식)?|손짓)/.test(t))return null;
 if(/(꺼|끄|끔|종료|중지|해제|그만|off)/i.test(t))return gsOff();
 if(/(켜|시작|실행|활성|on)/i.test(t))return gsOn();
 return(GS?"손동작 인식이 켜져 있습니다. ":"손동작 인식은 꺼져 있습니다. ")+"‘손동작 켜줘’ 또는 ‘손동작 꺼줘’라고 말씀하세요. "+GSHELP+" "+CAMHELP}
$("gs").onclick=()=>{if(GS)add("f",gsOff());else gsOn().then(m=>add(GS?"f":"e",m))};gsBtn();
// 페이지를 열면 손동작 자동 시작 (기본: 노트북·PC는 켬, 폰은 배터리 때문에 끔). 카메라 권한을 거부한 상태면 시도하지 않음
const gsAutoOn=()=>L.f_gsauto?L.f_gsauto==="1":!/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
async function gsAuto(){if(!gsAutoOn()||GS||GSL)return;try{if(navigator.permissions){const s=await navigator.permissions.query({name:"camera"});if(s.state==="denied")return}}catch(_){}
 const m=await gsOn();$("hr").textContent=GS?"손동작 인식을 자동으로 켰습니다. ‘손동작 자동 시작 꺼줘’로 끌 수 있습니다":"손동작 자동 시작 실패: "+m}
setTimeout(gsAuto,1500);

 const c=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),dt=d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});

 if(st!=="speak"){if(!capOff)capOff=Date.now();else if(Date.now()-capOff>1500)capClr()}else capOff=0;if(B.dataset.st!==st)B.dataset.st=st;if(B.dataset.act!==a)B.dataset.act=a;if($("stt").textContent!==tx)$("stt").textContent=tx;if($("hSt").textContent!==tx)$("hSt").textContent=tx}catch(_){}}
